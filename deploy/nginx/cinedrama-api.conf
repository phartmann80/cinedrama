# CineDrama API - Nginx reverse proxy
#
# Install: sudo cp deploy/nginx/cinedrama-api.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/cinedrama-api.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# After DNS is pointed, run certbot:
#   sudo certbot --nginx -d api.cinedrama.app
#
# This config assumes the backend listens on 127.0.0.1:5000.

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=cinedrama_api:10m rate=30r/s;

# HTTP - redirect to HTTPS (certbot will manage the SSL block)
server {
    listen 80;
    server_name api.cinedrama.app;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - main API proxy
server {
    listen 443 ssl http2;
    server_name api.cinedrama.app;

    # SSL certificates managed by certbot/Let's Encrypt
    # Certbot will insert the ssl_certificate lines here.
    # Placeholder for certbot:
    # ssl_certificate /etc/letsencrypt/live/api.cinedrama.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.cinedrama.app/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Body size limit (media uploads go through a separate gateway, not here)
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml;

    # Rate limiting
    limit_req zone=cinedrama_api burst=60 nodelay;

    # Proxy to the backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check - no rate limit
    location = /api/healthz {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
