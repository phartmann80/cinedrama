# CineDrama API - Nginx reverse proxy
#
# Two-phase SSL setup:
#
#   Phase 1 (HTTP only - lets certbot obtain certs):
#     sudo cp deploy/nginx/cinedrama-api.conf /etc/nginx/sites-available/
#     sudo ln -s /etc/nginx/sites-available/cinedrama-api.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d api.cinedrama.app
#
#   Phase 2 (enable HTTPS):
#     Uncomment the entire 443 server block below (search: UNCOMMENT AFTER CERTBOT)
#     sudo nginx -t && sudo systemctl reload nginx
#
# This config assumes the backend listens on 127.0.0.1:5000.

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=cinedrama_api:10m rate=30r/s;

# ── Phase 1: HTTP-only server block (active on fresh install) ──────────────
# Serves the ACME challenge for certbot and proxies everything else to the
# backend over plain HTTP until certs are obtained.

server {
    listen 80;
    server_name api.cinedrama.app;

    # Certbot ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy all other traffic to the backend (plain HTTP until certs exist)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check - no rate limit
    location = /api/healthz {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

