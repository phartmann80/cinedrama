# CineDrama Web - Nginx reverse proxy (cinedrama.app) — FINAL CONFIG
#
# This is the active config once Let's Encrypt certs exist at the paths below.
# Bootstrap flow (run as root on the VPS):
#
#   1. Obtain certs first with a TEMPORARY ACME-only vhost (see
#      deploy/web-vps-runbook.md) — do NOT install this file before certs exist
#      or `nginx -t` will fail on the missing certificate paths.
#   2. Only after `certbot` succeeds, install THIS file:
#        sudo install -m 644 deploy/nginx/cinedrama-web.conf \
#          /etc/nginx/sites-available/cinedrama-web.conf
#        sudo ln -sf /etc/nginx/sites-available/cinedrama-web.conf \
#          /etc/nginx/sites-enabled/cinedrama-web.conf
#        sudo nginx -t && sudo systemctl reload nginx
#
# Assumptions:
#   - Next.js runs on 127.0.0.1:3000  (systemd: cinedrama-web)
#   - Express API runs on 127.0.0.1:5000 (systemd: cinedrama-api)
#   - APK served from /opt/cinedrama/downloads/
#   - api.cinedrama.app keeps its own vhost (deploy/nginx/cinedrama-api.conf).

limit_req_zone $binary_remote_addr zone=cinedrama_web:10m rate=30r/s;

# ── HTTP: ACME + redirect to HTTPS ────────────────────────────────────────
server {
    listen 80;
    server_name cinedrama.app www.cinedrama.app;

    # Certbot / ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main site, API proxy, APK downloads ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name cinedrama.app www.cinedrama.app;

    ssl_certificate /etc/letsencrypt/live/cinedrama.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cinedrama.app/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml;

    # Rate limiting (applies to the main site)
    limit_req zone=cinedrama_web burst=60 nodelay;

    # Static APK downloads
    location /download/ {
        alias /opt/cinedrama/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # API proxied to the Express backend on the main domain (convenience)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Next.js landing page / app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
