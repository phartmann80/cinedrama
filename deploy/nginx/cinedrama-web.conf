# CineDrama Web - Nginx reverse proxy (cinedrama.app)
#
# Two-phase SSL setup:
#
#   Phase 1 (HTTP only - lets certbot obtain certs):
#     sudo cp deploy/nginx/cinedrama-web.conf /etc/nginx/sites-available/
#     sudo ln -s /etc/nginx/sites-available/cinedrama-web.conf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d cinedrama.app -d www.cinedrama.app
#
#   Phase 2 (enable HTTPS):
#     Uncomment the 443 server block below (search: UNCOMMENT AFTER CERTBOT)
#     sudo nginx -t && sudo systemctl reload nginx
#
# Assumptions:
#   - Next.js runs on 127.0.0.1:3000  (systemd: cinedrama-web)
#   - Express API runs on 127.0.0.1:5000 (systemd: cinedrama-api, already deployed)
#   - APK is served from /opt/cinedrama/downloads/
#
# Keep the api.cinedrama.app vhost (deploy/nginx/cinedrama-api.conf) separate;
# this file is only for the main site.

# ── Phase 1: HTTP-only server block (active on fresh install) ──────────────
server {
    listen 80;
    server_name cinedrama.app www.cinedrama.app;

    # Certbot ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Static APK downloads
    location /download/ {
        alias /opt/cinedrama/downloads/;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # API proxied to the Express backend on the main domain (convenience)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Next.js landing page / app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

